<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-INVEST | Grupo Z</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden !important; max-width:100vw !important; background:#0a0a0f; color:#fff; font-family:Arial,sans-serif}
header nav{display:flex;justify-content:space-between;padding:20px 5%;background:#0a0a0f;border-bottom:1px solid #1e1e2a;align-items:center;position:relative}
.logo{font-weight:800;letter-spacing:2px}
header ul{display:flex;list-style:none;gap:20px}
header a,header a:visited,header a:link{color:#A8A9AD !important;text-decoration:none !important}
header a:hover{color:#fff !important}
.menu-toggle{display:none;font-size:26px;cursor:pointer;color:#fff}
.hero{height:60vh;min-height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(rgba(5,5,10,0.6),rgba(5,5,10,0.85)),url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=1600') center/cover}
.ecossistema{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:60px 40px}
.card{position:relative;height:360px;border-radius:16px;overflow:hidden;border:1px solid #1e1e2a;background:#11111d;display:flex;align-items:flex-end;text-decoration:none !important;transition:0.4s}
.card:visited{color:#fff !important}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.75;transition:0.4s}
.card:hover .card-bg{opacity:0.95;transform:scale(1.05)}.card:hover{transform:translateY(-6px);border-color:#00C98D}
.card-content{position:relative;z-index:2;width:100%;padding:24px;background:linear-gradient(to top, rgba(0,0,0,0.85), transparent)}
.card-content h3{color:#fff}.card-content p{color:#fff;font-size:12px}.card-content span{color:#fff;font-size:11px}
@media(max-width:900px){.menu-toggle{display:block}header ul{display:none;position:absolute;top:68px;left:0;width:100%;flex-direction:column;background:#0a0a0f;padding:20px;border-top:1px solid #222}header ul.active{display:flex}.ecossistema{grid-template-columns:1fr;padding:20px}}
/* FIX FIRMEZA */
#page-transition{position:fixed !important;inset:0 !important;width:100vw !important;height:100dvh !important;background:#0a0a0f !important;z-index:99999 !important;transform:translateY(100%) !important;transition:transform 1.2s cubic-bezier(0.76,0,0.24,1) !important;display:none !important}
#page-transition.active{display:block !important;transform:translateY(0%) !important}
body.page-enter{animation:pageEnter 1.2s ease forwards}@keyframes pageEnter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="page-transition"></div>
<header><nav><div class="logo">GRUPO Z</div><div class="menu-toggle" id="menu-toggle">☰</div><ul id="menu"><li><a href="index.html">Início</a></li><li><a href="tech.html">Z-TECH</a></li><li><a href="invest.html">Z-INVEST</a></li><li><a href="const.html">Z-CONST</a></li></ul></nav></header>
<section class="hero"><h1>Z-INVEST</h1><span style="color:#A8A9AD;margin-top:8px">Capital Inteligente</span></section>
<section class="ecossistema">
<a class="card" href="invest/leiloes.html"><div class="card-bg" style="background-image:url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=800')"></div><div class="card-content"><h3>Leilões</h3><p>Imóveis até 50% abaixo.</p><span>Ver →</span></div></a>
<a class="card" href="invest/consultoria.html"><div class="card-bg" style="background-image:url('https://images.unsplash.com/photo-1553729459-efe14ef6055d?q=80&w=800')"></div><div class="card-content"><h3>Consultoria</h3><p>Gestão patrimonial.</p><span>Ver →</span></div></a>
<a class="card" href="invest/gestao.html"><div class="card-bg" style="background-image:url('https://images.unsplash.com/photo-1454165205744-3b78555e5572?q=80&w=800')"></div><div class="card-content"><h3>Gestão</h3><p>Multiplique seu patrimônio.</p><span>Ver →</span></div></a>
</section>
<script>
document.getElementById('menu-toggle').addEventListener('click',()=>{document.getElementById('menu').classList.toggle('active')})
document.body.classList.add('page-enter')
const t=document.getElementById('page-transition');t.style.display='none'
document.querySelectorAll('a[href$=".html"]').forEach(a=>{a.addEventListener('click',e=>{const h=a.getAttribute('href');if(h.startsWith('#'))return;if(a.hostname===location.hostname){e.preventDefault();t.style.setProperty('display','block','important');void t.offsetWidth;t.classList.add('active');setTimeout(()=>location.href=h,1200)}})})
window.addEventListener('pageshow',()=>{t.classList.remove('active');setTimeout(()=>t.style.setProperty('display','none','important'),1300)})
</script>
</body>
</html>
