<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z-TECH | Grupo Z</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:Arial,sans-serif}
header nav{display:flex;justify-content:space-between;padding:20px 5%;background:#0a0a0f;border-bottom:1px solid #1e1e2a;align-items:center;position:relative}
.logo{font-weight:800;letter-spacing:2px}header ul{display:flex;list-style:none;gap:20px}header a{color:#A8A9AD;text-decoration:none}
.menu-toggle{display:none;font-size:26px;cursor:pointer;color:#fff}
.hero{height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(rgba(5,5,10,0.65),rgba(5,5,10,0.85)),url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1600') center/cover}
.ecossistema{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:60px 40px}
.card{position:relative;height:360px;border-radius:16px;overflow:hidden;border:1px solid #1e1e2a;background:#11111d;display:flex;align-items:flex-end;text-decoration:none;transition:0.4s}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.75;transition:0.4s}
.card:hover .card-bg{opacity:0.95;transform:scale(1.05)}.card:hover{transform:translateY(-6px);border-color:#0066FF}
.card-content{position:relative;z-index:2;width:100%;padding:24px;background:linear-gradient(to top, rgba(0,0,0,0.85), transparent)}
.card-content h3{color:#fff}.card-content p{color:#fff;font-size:12px}.card-content span{color:#fff;font-size:11px}
@media(max-width:900px){.menu-toggle{display:block}header ul{display:none;position:absolute;top:68px;left:0;width:100%;flex-direction:column;background:#0a0a0f;padding:20px;border-top:1px solid #222}header ul.active{display:flex}.ecossistema{grid-template-columns:1fr;padding:20px}}
</style>
</head>
<body>
<header><nav><div class="logo">GRUPO Z</div><div class="menu-toggle" id="menu-toggle">☰</div><ul id="menu"><li><a href="index.html">Início</a></li><li><a href="tech.html">Z-TECH</a></li><li><a href="const.html">Z-CONST</a></li><li><a href="invest.html">Z-INVEST</a></li></ul></nav></header>

<section class="ecossistema">

<a class="card"><div class="card-bg" style="background-image:url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=800')"></div><div class="card-content"><h3>Desenvolvimento</h3><p>Sites e sistemas sob medida.</p><span>Ver →</span></div></a>
<a class="card"><div class="card-bg" style="background-image:url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800')"></div><div class="card-content"><h3>Suporte</h3><p>Monitoramento 24/7.</p><span>Ver →</span></div></a>
</section>
<script>document.getElementById('menu-toggle').addEventListener('click',()=>{document.getElementById('menu').classList.toggle('active')})</script>
</body>
</html>
